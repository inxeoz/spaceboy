<div class="code-block-wrapper"{{ if .Type }} data-lang="{{ .Type }}"{{ end }} data-testid="code-block">
  {{- with .Attributes.title }}
  <div class="code-title" data-testid="code-title">{{ . }}</div>
  {{- end }}
  {{- with .Type }}
  <span class="lang-code-btn" aria-label="Code language: {{ . }}" data-testid="lang-code-btn">{{ . }}</span>
  {{- end }}
  <button class="wrap-code-btn" aria-label="Toggle line wrap" title="Toggle line wrap" data-testid="wrap-code-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><path d="M3 12h15a3 3 0 1 1 0 6h-4"></path><polyline points="16 16 14 18 16 20"></polyline><line x1="3" y1="18" x2="10" y2="18"></line></svg>
  </button>
  <button class="copy-code-btn" aria-label="Copy code" data-testid="copy-code-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
  </button>
{{ transform.Highlight .Inner .Type }}
</div>
