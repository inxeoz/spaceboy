{{- $u := urls.Parse .Destination -}}
{{- $isExternal := and $u.IsAbs (ne $u.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $isExternal }} class="external-link" target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
{{- /* chomp trailing newline */ -}}
