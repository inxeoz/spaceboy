{{ if .TableOfContents }}
<div class="toc-card" data-testid="toc-card">
  <div class="toc-header" data-testid="toc-main-header">{{ .Param "tocTitle" | default "Contents" }}</div>
<nav class="toc-nav toc-main" id="toc-nav" data-testid="toc-main-nav">
    {{ .TableOfContents }}
  </nav>
</div>
{{ end }}
