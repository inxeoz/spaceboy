<div class="theme-overlay" id="theme-overlay" hidden aria-modal="true" role="dialog" aria-label="Theme switcher" data-testid="theme-overlay">
  <div class="theme-overlay-panel" data-testid="theme-overlay-panel">
    <div class="theme-overlay-title" data-testid="theme-overlay-title">pick a palette</div>
    <div class="theme-overlay-tabs" data-testid="theme-overlay-tabs">
      <span class="active" data-testid="theme-overlay-tab-all">all</span>
    </div>
    <div class="theme-overlay-list" id="theme-overlay-list" role="listbox" aria-label="Color palettes" data-testid="theme-overlay-list">
      <div class="theme-sep" data-testid="theme-sep-light">light</div>
      <button role="option" data-palette="tokyo-night-day" aria-selected="false" data-testid="palette-option-tokyo-night-day">Tokyo Night Day</button>
      <button role="option" data-palette="catppuccin-latte" aria-selected="false" data-testid="palette-option-catppuccin-latte">Catppuccin Latte</button>
      <button role="option" data-palette="gruvbox-light" aria-selected="false" data-testid="palette-option-gruvbox-light">Gruvbox Light</button>
      <button role="option" data-palette="one-light" aria-selected="false" data-testid="palette-option-one-light">One Light</button>
      <button role="option" data-palette="solarized-light" aria-selected="false" data-testid="palette-option-solarized-light">Solarized Light</button>
      <button role="option" data-palette="kanagawa-lotus" aria-selected="false" data-testid="palette-option-kanagawa-lotus">Kanagawa Lotus</button>
      <button role="option" data-palette="rose-pine-dawn" aria-selected="false" data-testid="palette-option-rose-pine-dawn">Rose Pine Dawn</button>

      <div class="theme-sep" data-testid="theme-sep-dark">dark</div>
      <button role="option" data-palette="herdr" aria-selected="false" data-testid="palette-option-herdr">Herdr</button>
      <button role="option" data-palette="taat" aria-selected="false" data-testid="palette-option-taat">Taat</button>
      <button role="option" data-palette="catppuccin" aria-selected="false" data-testid="palette-option-catppuccin">Catppuccin</button>
      <button role="option" data-palette="terminal" aria-selected="false" data-testid="palette-option-terminal">Terminal</button>
      <button role="option" data-palette="tokyo-night" aria-selected="false" data-testid="palette-option-tokyo-night">Tokyo Night</button>
      <button role="option" data-palette="dracula" aria-selected="false" data-testid="palette-option-dracula">Dracula</button>
      <button role="option" data-palette="nord" aria-selected="false" data-testid="palette-option-nord">Nord</button>
      <button role="option" data-palette="gruvbox" aria-selected="false" data-testid="palette-option-gruvbox">Gruvbox</button>
      <button role="option" data-palette="one-dark" aria-selected="false" data-testid="palette-option-one-dark">One Dark</button>
      <button role="option" data-palette="solarized" aria-selected="false" data-testid="palette-option-solarized">Solarized</button>
      <button role="option" data-palette="kanagawa" aria-selected="false" data-testid="palette-option-kanagawa">Kanagawa</button>
      <button role="option" data-palette="rose-pine" aria-selected="false" data-testid="palette-option-rose-pine">Rose Pine</button>
      <button role="option" data-palette="vesper" aria-selected="false" data-testid="palette-option-vesper">Vesper</button>
    </div>
    <div class="theme-overlay-footer" data-testid="theme-overlay-footer">
      <span data-testid="theme-overlay-shortcuts"><span class="key">esc</span> cancel &nbsp; <span class="key">enter</span> commit</span>
      <div class="theme-overlay-actions" data-testid="theme-overlay-actions">
        <button class="theme-apply-btn" id="theme-apply-btn" type="button" data-testid="theme-apply-btn">apply</button>
        <button class="theme-close-btn" id="theme-close-btn" type="button" data-testid="theme-close-btn">cancel</button>
      </div>
    </div>
  </div>
</div>
